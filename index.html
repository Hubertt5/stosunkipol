        // Funkcja do mieszania tablicy (Fisher-Yates shuffle)
        function shuffleArray(array) {
            const newArray = [...array];
            for (let i = newArray.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [newArray[i], newArray[j]] = [newArray[j], newArray[i]];
            }
            return newArray;
        }

            const indexMap = question.options.map((opt, idx) => idx);
            
            // Mieszamy indeksy
            const shuffledIndexMap = shuffleArray(indexMap);
            
            // Tworzymy nową tablicę odpowiedzi w pomieszanej kolejności
            preparedQuestion.options = shuffledIndexMap.map(idx => question.options[idx]);
            
            // Aktualizujemy poprawne odpowiedzi
            if (question.multiple) {
                // Dla pytań wielokrotnego wyboru
                preparedQuestion.correct = question.correct.map(correctIdx => 
                    shuffledIndexMap.indexOf(correctIdx)
                );
            } else {
                // Dla pytań jednokrotnego wyboru
                preparedQuestion.correct = shuffledIndexMap.indexOf(question.correct);
            }
            
            return preparedQuestion;
        }

        // Inicjalizacja quizu
        function initQuiz() {
            // Mieszamy pytania
            const shuffledQuestions = shuffleArray(quizDataOriginal);
            
            // Przygotowujemy każde pytanie (mieszamy odpowiedzi)
            quizData = shuffledQuestions.map(q => prepareQuestion(q));
            
            currentQuestion = 0;
            score = 0;
            document.getElementById('score').textContent = '0';
            document.getElementById('total').textContent = quizData.length;
            
            loadQuestion();
        }

        function loadQuestion() {
            const container = document.getElementById('quizContainer');
            const question = quizData[currentQuestion];
            
            let optionsHTML = '';
            question.options.forEach((option, index) => {
                optionsHTML += `
                    <li class="option" onclick="selectAnswer(${index})">
                        <input type="${question.multiple ? 'checkbox' : 'radio'}" 
                               name="answer" 
                               value="${index}" 
                               id="option${index}">
                        <label for="option${index}">${option}</label>
                    </li>
                `;
            });

            container.innerHTML = `
                <div class="question-container">
                    <div class="question-number">Pytanie ${currentQuestion + 1} z ${quizData.length}</div>
                    <div class="question">${question.question}</div>
                    <ul class="options">
                        ${optionsHTML}
                    </ul>
                    <div class="feedback" id="feedback"></div>
                    <div class="buttons">
                        <button class="btn-next" onclick="checkAnswer()">Sprawdź odpowiedź</button>
                    </div>
                </div>
            `;

            updateProgress();
        }

        function selectAnswer(index) {
            const question = quizData[currentQuestion];
            const options = document.querySelectorAll('.option');
            
            if (question.multiple) {
                options[index].classList.toggle('selected');
            } else {
                options.forEach(opt => opt.classList.remove('selected'));
                options[index].classList.add('selected');
            }
        }

        function checkAnswer() {
            const question = quizData[currentQuestion];
            const options = document.querySelectorAll('.option');
            const feedback = document.getElementById('feedback');
            
            let selectedAnswers = [];
            options.forEach((option, index) => {
                if (option.classList.contains('selected')) {
                    selectedAnswers.push(index);
                }
            });

            if (selectedAnswers.length === 0) {
                alert('Proszę wybrać odpowiedź!');
                return;
            }

            let isCorrect = false;
            
            if (question.multiple) {
                isCorrect = JSON.stringify(selectedAnswers.sort()) === JSON.stringify(question.correct.sort());
            } else {
                isCorrect = selectedAnswers[0] === question.correct;
            }

            options.forEach((option, index) => {
                option.classList.add('disabled');
                option.onclick = null;
                
                if (question.multiple) {
                    if (question.correct.includes(index)) {
                        option.classList.add('correct');
                    }
                    if (selectedAnswers.includes(index) && !question.correct.includes(index)) {
                        option.classList.add('incorrect');
                    }
                } else {
                    if (index === question.correct) {
                        option.classList.add('correct');
                    }
                    if (selectedAnswers.includes(index) && index !== question.correct) {
                        option.classList.add('incorrect');
                    }
                }
            });

            if (isCorrect) {
                score++;
                feedback.className = 'feedback show correct';
                feedback.innerHTML = `
                    <strong>✓ Poprawna odpowiedź!</strong>
                    <div class="explanation">${question.explanation}</div>
                `;
            } else {
                feedback.className = 'feedback show incorrect';
                feedback.innerHTML = `
                    <strong>✗ Niepoprawna odpowiedź</strong>
                    <div class="explanation">${question.explanation}</div>
                `;
            }

            document.getElementById('score').textContent = score;

            const buttonsDiv = document.querySelector('.buttons');
            buttonsDiv.innerHTML = `
                <button class="btn-next" onclick="nextQuestion()">
                    ${currentQuestion < quizData.length - 1 ? 'Następne pytanie →' : 'Zobacz wynik'}
                </button>
            `;
        }

        function nextQuestion() {
            currentQuestion++;
            
            if (currentQuestion < quizData.length) {
                loadQuestion();
            } else {
                showFinalScore();
            }
        }

        function updateProgress() {
            const progress = ((currentQuestion) / quizData.length) * 100;
            document.getElementById('progressBar').style.width = progress + '%';
        }

        function showFinalScore() {
            const percentage = (score / quizData.length * 100).toFixed(1);
            const container = document.getElementById('quizContainer');
            
            let message = '';
            let emoji = '';
            
            if (percentage >= 90) {
                message = 'Doskonały wynik!';
                emoji = '🏆';
            } else if (percentage >= 70) {
                message = 'Bardzo dobry wynik!';
                emoji = '🎉';
            } else if (percentage >= 50) {
                message = 'Dobra robota!';
                emoji = '👍';
            } else {
                message = 'Spróbuj ponownie!';
                emoji = '📚';
            }

            container.innerHTML = `
                <div class="final-score">
                    <h2>${emoji} ${message}</h2>
                    <p>Twój wynik: <strong>${score}</strong> na <strong>${quizData.length}</strong></p>
                    <p>Procent poprawnych odpowiedzi: <strong>${percentage}%</strong></p>
                    <button class="btn-next restart-btn" onclick="restartQuiz()">
                        🔄 Rozpocznij quiz od nowa
                    </button>
                </div>
            `;
            
            document.getElementById('progressBar').style.width = '100%';
        }

        function restartQuiz() {
            initQuiz();
        }

        // Start quiz
        window.onload = function() {
            initQuiz();
        };
    </script>
</body>
</html>
